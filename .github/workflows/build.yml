name: build-appimage

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appimage
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Cheap gate: catches the patch classes that broke releases before any 7-minute build runs.
      - run: scripts/check-patch.sh
      - run: df -h /tmp

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # The host typecheck needs more heap than the runner default, and gate parallelism drives peak memory.
      NODE_OPTIONS: --max-old-space-size=6144
      DSH_GATE_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          version=$(npm view @deepseek-ai/dsh@latest version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - if: steps.version.outputs.skip == '0'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ github.run_id }}
          restore-keys: pnpm-store-

      - if: steps.version.outputs.skip == '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools xvfb libfuse2

      - if: steps.version.outputs.skip == '0'
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - if: steps.version.outputs.skip == '0'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - if: steps.version.outputs.skip == '0'
        run: scripts/build.sh "dsh-v${{ steps.version.outputs.version }}"

      - if: steps.version.outputs.skip == '0'
        run: |
          xvfb-run -a scripts/verify-appimage.sh dist/*.AppImage

      - if: steps.version.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          upstream="dsh-v${{ steps.version.outputs.version }}"
          sha=$(sha256sum dist/*.AppImage | cut -d' ' -f1)
          # Upstream publishes a real changelog per tag; reuse it instead of a fixed string.
          body=$(gh api "repos/deepseek-ai/deepseek-harness/releases/tags/$upstream" --jq .body 2>/dev/null || true)
          {
            echo "Unofficial Linux AppImage for DeepSeek Harness ${{ steps.version.outputs.version }}, built from upstream tag \`$upstream\` with [\`patches/linux-x64.patch\`](../blob/master/patches/linux-x64.patch)."
            echo
            echo "- **sha256**: \`$sha\`"
            echo "- **requires**: x86_64, glibc >= 2.28, GTK3/NSS/ALSA, FUSE 2 (or \`--appimage-extract-and-run\`)"
            echo "- **install**: \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/master/install.sh | bash\`"
            if [ -n "$body" ]; then
              echo
              echo "## Upstream changes"
              echo
              printf '%s\n' "$body"
            fi
          } > notes.md
          gh release create "$tag" dist/*.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --title "DeepSeek Harness ${{ steps.version.outputs.version }} (Linux)" \
            --notes-file notes.md \
            || gh release upload "$tag" dist/*.AppImage --clobber --repo "$GITHUB_REPOSITORY"
